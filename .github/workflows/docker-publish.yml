name: Docker Publish

on:
  workflow_run:
    workflows: [Publish]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-main
  cancel-in-progress: false

jobs:
  docker:
    name: Build and publish LTS image
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Resolve latest npm package version
        id: npm
        shell: bash
        run: |
          VERSION="$(npm view pw2c-mssql-server-mcp version)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if release image already exists
        id: image_check
        shell: bash
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/pw2c-mssql-server-mcp:v${{ steps.npm.outputs.version }}"

          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Image already exists for version v${{ steps.npm.outputs.version }}. Skipping build."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "No image found for version v${{ steps.npm.outputs.version }}. Building now."
          fi

      - name: Setup Docker Buildx
        if: ${{ steps.image_check.outputs.should_build == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        if: ${{ steps.image_check.outputs.should_build == 'true' }}
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pw2c-mssql-server-mcp
          tags: |
            type=raw,value=lts
            type=raw,value=latest
            type=raw,value=v${{ steps.npm.outputs.version }}
            type=sha,prefix=sha-

      - name: Build and push image
        if: ${{ steps.image_check.outputs.should_build == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.lts
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            NPM_PACKAGE_NAME=pw2c-mssql-server-mcp
            NPM_PACKAGE_VERSION=${{ steps.npm.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
