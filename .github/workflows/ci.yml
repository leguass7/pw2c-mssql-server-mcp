name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  lint-and-build:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    env:
      CI_MSSQL_SA_PASSWORD: 'Your_strong_Password123!'
      DATABASE_URL: 'Server=localhost,1433;Database=mcp_ci;User Id=sa;Password=Your_strong_Password123!;Encrypt=true;TrustServerCertificate=true;'

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: 'Your_strong_Password123!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Your_strong_Password123! -Q 'SELECT 1' -C"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait and seed MSSQL
        run: pnpm exec tsx scripts/ci-wait-and-seed-mssql.ts

      - name: Run lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Run build
        run: pnpm build
